"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#ff6048)\
[  ](bg:#ff6048 fg:#040e0d)\
[](bg:#ffa478 fg:#ff6048)\
$directory\
[](fg:#ffa478 bg:#f5cd5b)\
$git_branch\
$git_status\
[](fg:#f5cd5b bg:#7ad9a8)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#7ad9a8 bg:#3dd1b0)\
$time\
[ ](fg:#3dd1b0)\
\n -> """

[directory]
style = "fg:#040e0d bg:#ffa478"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#f5cd5b"
format = '[[ $symbol $branch ](fg:#0f211f bg:#f5cd5b)]($style)'

[git_status]
style = "bg:#f5cd5b"
format = '[[($all_status$ahead_behind )](fg:#0f211f bg:#f5cd5b)]($style)'

[nodejs]
symbol = ""
style = "bg:#7ad9a8"
format = '[[ $symbol ($version) ](fg:#152a26 bg:#7ad9a8)]($style)'

[rust]
symbol = ""
style = "bg:#7ad9a8"
format = '[[ $symbol ($version) ](fg:#152a26 bg:#7ad9a8)]($style)'

[golang]
symbol = ""
style = "bg:#7ad9a8"
format = '[[ $symbol ($version) ](fg:#152a26 bg:#7ad9a8)]($style)'

[php]
symbol = ""
style = "bg:#7ad9a8"
format = '[[ $symbol ($version) ](fg:#152a26 bg:#7ad9a8)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#3dd1b0"
format = '[[  $time ](fg:#3a1a35 bg:#3dd1b0)]($style)'
